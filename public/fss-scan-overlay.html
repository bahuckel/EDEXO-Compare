<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FSS Scan — bodies</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent !important;
        overflow: hidden;
        font-family: Segoe UI, system-ui, sans-serif;
      }
      .shell {
        min-width: 14rem;
        max-width: 22rem;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .shell.shell--off {
        opacity: 0;
        transform: scale(0.96);
        pointer-events: none;
      }
      .card {
        margin: 0;
        padding: 0.5rem 0.78rem 0.6rem;
        font-size: 0.78rem;
        font-weight: 600;
        line-height: 1.38;
        letter-spacing: 0.03em;
        color: rgba(232, 244, 255, 0.96);
        background: linear-gradient(165deg, rgba(42, 88, 180, 0.78), rgba(18, 40, 95, 0.82));
        border: 1px solid rgba(120, 190, 255, 0.45);
        border-radius: 10px;
        box-shadow: 0 8px 28px rgba(0, 20, 60, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      .card.card--complete {
        border-color: rgba(100, 220, 160, 0.55);
        background: linear-gradient(165deg, rgba(28, 100, 72, 0.78), rgba(12, 52, 40, 0.85));
      }
      .title {
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.9;
        margin-bottom: 0.35rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        padding-bottom: 0.25rem;
      }
      .dline {
        font-family: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.03em;
      }
      .dline .lbl {
        font-weight: 800;
        text-transform: uppercase;
        font-size: 0.68rem;
        letter-spacing: 0.1em;
        margin-right: 0.35rem;
        opacity: 0.9;
      }
      .dline .sys {
        font-weight: 600;
        opacity: 0.92;
      }
      .dline .nums {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      .sub {
        margin-top: 0.35rem;
        font-size: 0.65rem;
        font-weight: 500;
        opacity: 0.62;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div class="shell" id="shell">
      <div class="card" id="card" role="status" aria-live="polite">
        <div class="title">FSS Scan</div>
        <div class="dline" id="dline">—</div>
        <div class="sub" id="sub">Honk progress vs bodies found (same as main D-Scan).</div>
      </div>
    </div>
    <script>
      var lastPort = 7111;
      function api(p) {
        var proto = location.protocol || "";
        if (proto === "http:" || proto === "https:") return p;
        return "http://127.0.0.1:" + lastPort + p;
      }

      function render(d) {
        var shell = document.getElementById("shell");
        var card = document.getElementById("card");
        shell.classList.remove("shell--off");
        var dscan = d.dScanBodies;
        if (!dscan || dscan.total == null) {
          card.className = "card";
          document.getElementById("dline").innerHTML =
            "<span class='lbl'>D-Scan</span> <span class='sys'>—</span> <span class='sep'> — </span> <span class='nums'>— / —</span> <span class='suffix'>bodies</span>";
          return;
        }
        var complete = dscan.complete || dscan.found >= dscan.total;
        card.className = "card" + (complete ? " card--complete" : "");
        var sys = dscan.systemName || "—";
        document.getElementById("dline").innerHTML =
          "<span class='lbl'>D-Scan</span> <span class='sys'>" +
          sys +
          "</span> <span class='sep'> — </span> <span class='nums'>" +
          dscan.found +
          " / " +
          dscan.total +
          "</span> <span class='suffix'>bodies</span>";
      }

      function tick() {
        fetch(api("/api/state"), { cache: "no-store" })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (typeof d.port === "number" && d.port > 0) lastPort = d.port;
            render(d);
          })
          .catch(function () {});
      }
      tick();
      setInterval(tick, 500);

      try {
        var proto = location.protocol === "https:" ? "wss:" : "ws:";
        var host =
          typeof location.host === "string" && location.host ? location.host : "127.0.0.1:7111";
        var ws = new WebSocket(proto + "//" + host + "/ws");
        ws.onmessage = function (ev) {
          try {
            var msg = JSON.parse(String(ev.data));
            if (msg.type === "state" && msg.payload) {
              if (typeof msg.payload.port === "number" && msg.payload.port > 0)
                lastPort = msg.payload.port;
              render(msg.payload);
            }
          } catch (_) {}
        };
      } catch (_) {}
    </script>
  </body>
</html>

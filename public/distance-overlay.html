<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exo-distance Tracker</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent !important;
        overflow: hidden;
        font-family:
          Segoe UI,
          system-ui,
          sans-serif;
      }
      .shell {
        min-width: 16rem;
        max-width: 22rem;
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
      }
      .shell.shell--off {
        opacity: 0;
        transform: scale(0.96);
        pointer-events: none;
      }
      .card {
        margin: 0;
        padding: 0.55rem 0.85rem 0.65rem;
        font-size: 0.78rem;
        font-weight: 600;
        line-height: 1.38;
        letter-spacing: 0.03em;
        color: rgba(232, 244, 255, 0.96);
        background: linear-gradient(165deg, rgba(42, 88, 180, 0.72), rgba(18, 40, 95, 0.78));
        border: 1px solid rgba(120, 190, 255, 0.45);
        border-radius: 10px;
        box-shadow:
          0 8px 28px rgba(0, 20, 60, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      /*
       * The minimap.
       *
       * Rotated so "up" is where the commander is looking, because a north-up map asks them to do
       * the rotation in their head while walking. It falls back to north-up when the game is not
       * reporting a heading, and says so rather than pretending.
       */
      .minimap {
        display: block;
        width: 100%;
        max-width: 11.5rem;
        margin: 0.35rem auto 0.05rem;
      }

      /* Three scans across, not down. Each is a label over its distance. */
      .scans {
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .scan {
        display: flex;
        align-items: baseline;
        gap: 0.3rem;
        min-width: 0;
      }
      .scan .lbl {
        opacity: 0.7;
      }
      .scan--muted {
        opacity: 0.45;
      }
      .minimap-rim {
        fill: rgba(6, 14, 30, 0.5);
        stroke: rgba(120, 190, 255, 0.45);
        stroke-width: 1.5;
      }
      /* The separation this genus needs — the ring you are trying to get outside of. */
      .minimap-minring {
        fill: none;
        stroke: rgba(255, 193, 77, 0.55);
        stroke-width: 1;
        stroke-dasharray: 4 3;
      }
      .minimap-grid {
        fill: none;
        stroke: rgba(120, 190, 255, 0.16);
        stroke-width: 0.8;
      }
      .minimap-you {
        fill: rgba(232, 244, 255, 0.95);
      }
      .minimap-you-dir {
        stroke: rgba(232, 244, 255, 0.95);
        stroke-width: 2;
        stroke-linecap: round;
      }
      .minimap-sample {
        fill: rgba(63, 185, 80, 0.9);
        stroke: rgba(8, 28, 12, 0.8);
        stroke-width: 0.6;
      }
      .minimap-ship {
        fill: rgba(255, 171, 64, 0.95);
        stroke: rgba(40, 22, 4, 0.8);
        stroke-width: 0.6;
      }
      /* Off the map: an arrow on the rim pointing the way, with how far. */
      .minimap-arrow--sample {
        fill: rgba(63, 185, 80, 0.9);
      }
      .minimap-arrow--ship {
        fill: rgba(255, 171, 64, 0.95);
      }
      .minimap-far-label {
        fill: rgba(232, 244, 255, 0.75);
        font-size: 8px;
        font-family: inherit;
      }
      .minimap-north {
        fill: rgba(232, 244, 255, 0.5);
        font-size: 9px;
        font-family: inherit;
      }
      .card.card--ok {
        background: linear-gradient(165deg, rgba(28, 120, 72, 0.78), rgba(12, 58, 40, 0.85));
        border-color: rgba(120, 255, 170, 0.45);
        animation: pulseGlow 1.1s ease-in-out infinite alternate;
      }
      @keyframes pulseGlow {
        from {
          box-shadow:
            0 8px 26px rgba(0, 40, 20, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.1),
            0 0 0 0 rgba(100, 255, 160, 0);
        }
        to {
          box-shadow:
            0 10px 36px rgba(0, 50, 30, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.14),
            0 0 22px 2px rgba(80, 255, 140, 0.2);
        }
      }
      .title {
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.88;
        margin-bottom: 0.38rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        padding-bottom: 0.28rem;
      }
      .species {
        font-size: 0.92rem;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.98);
        margin-bottom: 0.35rem;
        text-shadow: 0 0 14px rgba(100, 180, 255, 0.35);
      }
      .card.card--ok .species {
        text-shadow: 0 0 16px rgba(140, 255, 190, 0.35);
      }
      .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.5rem;
        margin-top: 0.28rem;
      }
      .row .lbl {
        flex-shrink: 0;
        opacity: 0.78;
        font-size: 0.74rem;
      }
      .row .val {
        text-align: right;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .row.row--muted .val,
      .row.row--muted .lbl {
        color: rgba(200, 210, 225, 0.55);
      }
      .pill {
        display: inline-block;
        margin-left: 0.25rem;
        padding: 0 0.35rem;
        border-radius: 999px;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        vertical-align: middle;
      }
      .pill.ok {
        background: rgba(80, 220, 140, 0.25);
        color: rgba(170, 255, 205, 0.95);
      }
      .pill.bad {
        background: rgba(255, 120, 100, 0.2);
        color: rgba(255, 200, 190, 0.9);
      }
      .subnote {
        font-size: 0.65rem;
        font-weight: 500;
        opacity: 0.58;
        margin-top: 0.35rem;
        line-height: 1.3;
      }
      .cele {
        margin-top: 0.35rem;
        font-size: 0.68rem;
        font-weight: 600;
        color: rgba(220, 255, 235, 0.88);
      }
    </style>
  </head>
  <body>
    <div class="shell" id="shell">
      <div class="card" id="card" role="status" aria-live="polite">
        <div class="title">Exo-distance Tracker</div>
        <div class="species" id="species">—</div>
        <div class="row" id="rowMin">
          <span class="lbl">Min gap (genus)</span>
          <span class="val" id="minGap">—</span>
        </div>
        <!--
          Three scans on one line, not three stacked rows.

          The owner: "the 3 vertically stacked scans on top take too much place as well... Can we
          have just Scan 1: X, Scan 2: X, Scan 3: X". Each X is the distance back to that sample, so
          the line reads as a row of anchors rather than a form.
        -->
        <div class="row scans" id="scanRow">
          <span class="scan" id="scan1"><span class="lbl">Scan 1</span><span class="val" id="d1">—</span></span>
          <span class="scan" id="scan2"
            ><span class="lbl">Scan 2</span><span class="val" id="d2">—</span><span id="pill2"></span
          ></span>
          <span class="scan" id="scan3"><span class="lbl">Scan 3</span><span class="val" id="pay">—</span></span>
        </div>
        <div class="row" id="rowSpan">
          <span class="lbl">Sample spacing</span>
          <span class="val"><span id="span12">—</span><span id="pillSpan"></span></span>
        </div>
        <!--
          The minimap. A plain list of distances tells you how far the last plant is; it does not
          tell you which way to walk, which is the thing you are actually deciding while standing on
          a rock. The owner asked for "a minimap based on the coordinates on the planet" and the
          coordinates were already being captured for the distance readouts above.
        -->
        <svg
          id="minimap"
          class="minimap"
          viewBox="-110 -110 220 220"
          role="img"
          aria-label="Where your samples and ship are, around you"
          style="display: none"
        ></svg>
        <div class="subnote" id="footNote"></div>
        <div class="cele" id="celebrate" style="display: none"></div>
      </div>
    </div>

    <script>
      var lastPort = 7111;
      function api(p) {
        var proto = location.protocol || "";
        if (proto === "http:" || proto === "https:") return p;
        return "http://127.0.0.1:" + lastPort + p;
      }

      function fmtCr(n) {
        if (n == null || !isFinite(n)) return "—";
        return n.toLocaleString() + " CR";
      }

      function fmtM(n) {
        if (n == null || !isFinite(n)) return "—";
        return Math.round(n) + " m";
      }

      function pillEl(ok) {
        if (ok === true) return ' <span class="pill ok" aria-hidden="true">OK</span>';
        if (ok === false) return ' <span class="pill bad" aria-hidden="true">LOW</span>';
        return "";
      }

      /**
       * Draw the minimap.
       *
       * Plot units are a 100-unit radius circle; metres are scaled into it. Anything beyond the
       * radius becomes an arrow on the rim with its distance beside it, which is the owner's rule
       * and also the only honest way to show it — clamping a 3 km plant to the edge as a dot would
       * say it is 500 m away.
       *
       * "Up" is the way the commander is facing when the game reports a heading. Without one it
       * stays north-up and the N stays visible so the difference is not silent.
       */
      var MAP_R = 100;
      function drawMinimap(mm) {
        var el = document.getElementById("minimap");
        if (!mm || !mm.marks) {
          el.style.display = "none";
          return;
        }
        el.style.display = "";
        var parts = [];
        var heading = typeof mm.headingDeg === "number" && isFinite(mm.headingDeg) ? mm.headingDeg : null;
        // Rotating the *scene* by -heading puts the way you are facing at the top of the map.
        var rot = heading == null ? 0 : -heading;
        var scale = MAP_R / (mm.radiusM > 0 ? mm.radiusM : 500);

        parts.push('<circle class="minimap-rim" cx="0" cy="0" r="' + MAP_R + '" />');
        parts.push('<circle class="minimap-grid" cx="0" cy="0" r="' + MAP_R / 2 + '" />');
        if (mm.minSampleDistanceM > 0 && mm.minSampleDistanceM * scale < MAP_R) {
          parts.push(
            '<circle class="minimap-minring" cx="0" cy="0" r="' +
              (mm.minSampleDistanceM * scale).toFixed(1) +
              '" />',
          );
        }

        parts.push('<g transform="rotate(' + rot.toFixed(2) + ')">');
        for (var i = 0; i < mm.marks.length; i++) {
          var m = mm.marks[i];
          // SVG y grows downward and north is up, so north becomes -y.
          var x = m.eastM * scale;
          var y = -m.northM * scale;
          var r = Math.sqrt(x * x + y * y);
          var cls = m.kind === "ship" ? "ship" : "sample";
          if (r <= MAP_R - 6) {
            var rr = m.kind === "ship" ? 4.5 : 3.5;
            parts.push(
              '<circle class="minimap-' + cls + '" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) +
                '" r="' + rr + '"><title>' + esc(m.label) + " — " + Math.round(m.distanceM) +
                " m</title></circle>",
            );
          } else {
            // On the rim, pointing outward, with the real distance beside it.
            var ang = (Math.atan2(y, x) * 180) / Math.PI;
            var ax = Math.cos((ang * Math.PI) / 180) * (MAP_R - 8);
            var ay = Math.sin((ang * Math.PI) / 180) * (MAP_R - 8);
            parts.push(
              '<g transform="translate(' + ax.toFixed(1) + "," + ay.toFixed(1) + ") rotate(" +
                ang.toFixed(1) + ')"><polygon class="minimap-arrow--' + cls +
                '" points="7,0 -3,-4.5 -3,4.5" /><title>' + esc(m.label) + " — " +
                Math.round(m.distanceM) + " m</title></g>",
            );
            // The label is counter-rotated so it reads level however the map is turned.
            parts.push(
              '<text class="minimap-far-label" x="' + (ax * 0.82).toFixed(1) + '" y="' +
                (ay * 0.82).toFixed(1) + '" text-anchor="middle" transform="rotate(' +
                (-rot).toFixed(2) + "," + (ax * 0.82).toFixed(1) + "," + (ay * 0.82).toFixed(1) +
                ')">' + Math.round(m.distanceM) + "</text>",
            );
          }
        }
        // North, inside the rotated group so it moves with the world rather than with the screen.
        /*
          Spelled out rather than a bare "N". On a rotating map the letter is the only thing telling
          you which way the world is, and the owner asked for it by name: "pole at heading 0 could
          be marked as North". Counter-rotated so it reads level whichever way the map is turned.
        */
        parts.push(
          '<text class="minimap-north" x="0" y="' + (-MAP_R + 12) +
            '" text-anchor="middle" transform="rotate(' + (-rot).toFixed(2) + ',0,' + (-MAP_R + 12) +
            ')">North</text>',
        );
        parts.push("</g>");

        // You, at the centre, always upright: a triangle when the heading is known, a dot when not.
        if (heading == null) {
          parts.push('<circle class="minimap-you" cx="0" cy="0" r="3.5" />');
        } else {
          parts.push('<polygon class="minimap-you" points="0,-7 4.5,4 0,1.5 -4.5,4" />');
        }
        el.innerHTML = parts.join("");
      }

      function esc(t) {
        return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      /**
       * Tell the host window how tall this overlay actually is.
       *
       * An overlay window is transparent, so height it is not using reads as a gap before the next
       * one — and height it *needs* and does not have simply cuts the content off, which is how the
       * radar ended up sliced in half. The page is the only thing that knows: its height depends on
       * whether a sample is in progress.
       *
       * Only on a real change, because a resize triggers a relayout of the whole stack.
       */
      var lastReportedHeight = 0;
      function reportHeight() {
        var ee = window.edexoElectron;
        if (!ee || typeof ee.resizeHudOverlay !== "function") return;
        var card = document.getElementById("card");
        if (!card) return;
        var h = Math.ceil(card.getBoundingClientRect().height) + 4;
        if (!h || Math.abs(h - lastReportedHeight) <= 2) return;
        lastReportedHeight = h;
        try {
          void ee.resizeHudOverlay({ height: h });
        } catch (e) {
          /* not in Electron, or the host said no; the overlay is still readable either way */
        }
      }

      function render(d) {
        var shell = document.getElementById("shell");
        var card = document.getElementById("card");
        shell.classList.remove("shell--off");
        var eo = d.exoOrganicOverlay;
        /*
          The radar draws whenever the game is reporting a surface position, session or not. It
          used to be nested inside the sample-session payload, so standing on a planet having just
          landed showed nothing at all.
        */
        drawMinimap(d.journalBoot ? null : d.exoMinimap);
        if (d.journalBoot || !eo || eo.visible !== true) {
          card.classList.remove("card--ok");
          document.getElementById("species").textContent = "—";
          document.getElementById("minGap").textContent = "—";
          document.getElementById("scan1").className = "scan scan--muted";
          document.getElementById("d1").textContent = "—";
          document.getElementById("scan2").className = "scan scan--muted";
          document.getElementById("d2").textContent = "—";
          document.getElementById("pill2").innerHTML = "";
          document.getElementById("span12").textContent = "—";
          document.getElementById("pillSpan").innerHTML = "";
          document.getElementById("rowSpan").style.display = "none";
          document.getElementById("pay").innerHTML = "<span class='row--muted'>—</span>";
          document.getElementById("footNote").textContent =
            d.exoMinimap
              ? "No sample in progress. The radar shows your ship and any plants taken here while this app was running."
              : "HUD is always visible. Data appears when you are in an active organic sample session from the journal.";
          document.getElementById("celebrate").style.display = "none";
          return;
        }

        if (eo.phase === "celebrate") {
          card.classList.add("card--ok");
        } else {
          card.classList.remove("card--ok");
        }

        document.getElementById("species").textContent = eo.speciesDisplay || "—";
        document.getElementById("minGap").textContent =
          eo.minSampleDistanceM > 0 ? eo.minSampleDistanceM + " m" : "—";

        document.getElementById("scan1").className =
          "scan" + (eo.distToFirstM == null && eo.phase === "tracking" ? " scan--muted" : "");

        document.getElementById("d1").textContent = fmtM(eo.distToFirstM);

        document.getElementById("scan2").className =
          "scan" +
          (eo.sampleCount < 2 || (eo.phase === "tracking" && eo.distToSecondM == null) ? " scan--muted" : "");
        document.getElementById("d2").textContent = eo.sampleCount >= 2 ? fmtM(eo.distToSecondM) : "—";

        document.getElementById("pill2").innerHTML =
          eo.sampleCount === 1 ? pillEl(eo.separationMeetsMin) : "";

        document.getElementById("span12").textContent =
          eo.sampleCount >= 2 ? fmtM(eo.spacingBetweenSamplesM) : "—";
        document.getElementById("pillSpan").innerHTML = eo.sampleCount >= 2 ? pillEl(eo.spacingMeetsMin) : "";

        document.getElementById("rowSpan").style.display = eo.sampleCount >= 2 ? "" : "none";

        var payEl = document.getElementById("pay");
        var foot = document.getElementById("footNote");
        var cele = document.getElementById("celebrate");
        cele.style.display = "none";

        if (eo.phase === "celebrate") {
          payEl.innerHTML =
            eo.finalCredits != null
              ? fmtCr(eo.finalCredits) +
                (eo.analyseWasLogged === true
                  ? " <span style='opacity:0.7'>(logged)</span>"
                  : " <span style='opacity:0.85'>(new codex 5×)</span>")
              : fmtCr(null);
          foot.textContent =
            eo.analyseWasLogged === true
              ? eo.footfallMult === 5
                ? "Includes first-footfall 5× on this body."
                : "No first-footfall 5× on this body."
              : eo.footfallMult === 5
                ? "5× new-codex payout (first footfall does not stack another ×5)."
                : "5× new-codex payout.";
          cele.style.display = "block";
          cele.textContent = "Complete — hiding in " + (eo.celebrationRemainSec || 0) + "s…";
        } else if (eo.sampleCount >= 2) {
          var a = eo.payLoggedCodex;
          var b = eo.payNewCodex;
          if (a != null && b != null) {
            payEl.innerHTML =
              "<span class='row--muted' style='opacity:0.82'>Est. " +
              fmtCr(b).replace(" CR", "") +
              " CR <span style='opacity:0.65'>new</span> · " +
              fmtCr(a).replace(" CR", "") +
              " CR <span style='opacity:0.65'>logged</span></span>";
          } else payEl.textContent = "—";
          foot.textContent =
            "Estimates: new codex = 5× list; logged codex = list × footfall (×1 or ×5). These are not multiplied together.";
        } else {
          payEl.innerHTML = "<span class='row--muted'>—</span>";
          foot.textContent =
            eo.sampleCount === 1
              ? "Need ≥ " + (eo.minSampleDistanceM || "?") + " m from first sample before second."
              : "";
        }
      }

      /* After paint, so the measurement is of what is actually on screen. */
      function renderAndFit(d) {
        render(d);
        requestAnimationFrame(reportHeight);
      }

      async function tick() {
        try {
          var r = await fetch(api("/api/state"), { cache: "no-store" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          var d = await r.json();
          if (typeof d.port === "number" && d.port > 0) lastPort = d.port;
          renderAndFit(d);
        } catch (e) {
          document.getElementById("shell").classList.remove("shell--off");
        }
      }

      tick();
      setInterval(tick, 320);

      try {
        var proto = location.protocol === "https:" ? "wss:" : "ws:";
        var host = typeof location.host === "string" && location.host ? location.host : "127.0.0.1:7111";
        var ws = new WebSocket(proto + "//" + host + "/ws");
        ws.onmessage = function (ev) {
          try {
            var msg = JSON.parse(String(ev.data));
            if (msg.type === "state" && msg.payload) {
              if (typeof msg.payload.port === "number" && msg.payload.port > 0) {
                lastPort = msg.payload.port;
              }
              renderAndFit(msg.payload);
            }
          } catch (_) {}
        };
      } catch (_) {}
    </script>
  </body>
</html>

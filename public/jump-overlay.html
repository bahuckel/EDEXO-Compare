<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next jump</title>
    <!-- One HUD section on its own. The look is hud.css, the section and its data feed are hud/ (main.js mounts it). -->
    <link rel="stylesheet" href="hud.css?v=13" />
  </head>
  <body>
    <div class="shell" id="shell">
      <div class="panel" id="card" role="status" aria-live="polite">
        <div class="panel__body" id="hud"></div>
      </div>
    </div>
    <script type="module">
      import { HUD } from "./hud/main.js";
      HUD.mount(["jump"]);
    </script>
  </body>
</html>

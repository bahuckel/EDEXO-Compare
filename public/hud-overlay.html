<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDEXO HUD</title>
    <!--
      The merged HUD: every chosen section inside one panel, in a fixed order (discovery scan,
      candidates, tracker, data value). Which sections come from the URL, e.g. ?s=fss,distance;
      no query means all four. The launcher's "merge" toggle opens this instead of separate windows.
    -->
    <link rel="stylesheet" href="hud.css?v=10" />
    <!-- phone: "Add to Home Screen" opens the HUD without browser chrome -->
    <link rel="manifest" href="hud.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#050406" />
  </head>
  <body>
    <div class="shell" id="shell">
      <div class="panel" id="card" role="status" aria-live="polite">
        <div class="panel__body" id="hud"></div>
      </div>
    </div>
    <script src="hud.js?v=10"></script>
    <script>
      HUD.mount(HUD.sectionsFromUrl());
    </script>
  </body>
</html>
